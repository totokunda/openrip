# Windows and Linux builds of the whole app (docs/plan/cross-platform-encoding.md, phase 2):
# FFmpeg (cached), the engine addon, the engine's portable tests and the renderer's tests,
# the installers, and a headless check of the packaged app (scripts/smoke/steps/xplat.mjs:
# the engine loads, a clip's frame renders, it plays, an export). The installers are kept
# as the run's artifacts for a few days. Nothing is signed or published.
name: Cross-platform builds

on:
  push:
    branches: [xplat]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The toolchain the engine is checked with (docs/plan/portability.md).
  RUST_VERSION: "1.89.0"
  # The engine's crates whose tests need no FFmpeg or audio device (engine/scripts/check-targets.sh).
  ENGINE_TESTS: -p openrip-model -p openrip-platform -p openrip-motion -p openrip-capcut -p openrip-v1 -p openrip-frame -p openrip-analysis -p openrip-speech -p openrip-render -p openrip-media -p openrip-audio -p openrip-playback -p openrip-export -p openrip-core
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    # Built on Ubuntu 22.04 so the addon needs no newer glibc and libstdc++ than 22.04's.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-22.04, ffmpeg: linux-x86_64, packages: deb AppImage }
          # No AppImage: electron-builder's arm64 AppImage runtime needs libz.so, which only
          # zlib's development package installs.
          - { arch: arm64, runner: ubuntu-22.04-arm, ffmpeg: linux-arm64, packages: deb }
    steps:
      # Without the filter packs submodule (900 MB): the app runs without it.
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          # FFmpeg (nasm, zlib), the engine (ALSA for cpal, libclang for bindgen, cmake for
          # whisper.cpp), running the app headless (Xvfb, Mesa's software Vulkan for wgpu), and
          # the system's ffmpeg and ffprobe, which tests use to make clips and read exports back.
          sudo apt-get install -y --no-install-recommends nasm zlib1g-dev libasound2-dev clang libclang-dev cmake \
            xvfb mesa-vulkan-drivers libgl1-mesa-dri libgtk-3-0 libnss3 libxss1 libgbm1 ffmpeg
          # electron-builder's own fpm (which makes the deb) is an x86 binary: arm64 uses Ruby's.
          if [ "${{ matrix.arch }}" = arm64 ]; then
            sudo apt-get install -y --no-install-recommends ruby ruby-dev
            sudo gem install --no-document fpm
          fi

      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
            engine -> target/addon
          cache-on-failure: true

      # Restored here and saved once the addon step has built it, even if a later step fails.
      - name: FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: engine/.ffmpeg/${{ matrix.ffmpeg }}
          key: ffmpeg-${{ matrix.ffmpeg }}-${{ hashFiles('engine/scripts/build-ffmpeg.sh') }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/app/package-lock.json

      - name: npm ci
        working-directory: apps/app
        run: npm ci

      - name: Engine addon (FFmpeg and openrip-node)
        working-directory: apps/app
        run: node scripts/build-engine.mjs

      - name: Save FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' && hashFiles(format('engine/.ffmpeg/{0}/.version', matrix.ffmpeg)) != ''
        uses: actions/cache/save@v4
        with:
          path: engine/.ffmpeg/${{ matrix.ffmpeg }}
          key: ffmpeg-${{ matrix.ffmpeg }}-${{ hashFiles('engine/scripts/build-ffmpeg.sh') }}

      # The render crate's tests decode clips, so the tests link the static FFmpeg just built:
      # its archives again in a group at the end (unlike the addon's, they aren't bundled into
      # one, so their order matters), then zlib. `--target` keeps these flags off build scripts.
      # Skipped: Mesa's software Vulkan (lavapipe) draws the last two cases of the effects
      # shader's switch (Rounded corners, Film strip) black, whatever they return; to check on
      # real GPUs.
      - name: Engine tests (portable crates)
        working-directory: engine
        env:
          FFMPEG_LIB: ${{ github.workspace }}/engine/.ffmpeg/${{ matrix.ffmpeg }}/lib
          FFMPEG_DIR: ${{ github.workspace }}/engine/.ffmpeg/${{ matrix.ffmpeg }}
        run: |
          # ffmpeg-static's ffmpeg (6.1) for the tests that make clips (Ubuntu's 4.4 lacks options
          # they use); ffprobe is the system's.
          export PATH="$(dirname "$(node -p "require('../apps/app/node_modules/ffmpeg-static')")"):$PATH"
          export RUSTFLAGS="-L $FFMPEG_LIB -C link-arg=-Wl,--start-group -C link-arg=-lavformat -C link-arg=-lavfilter -C link-arg=-lavcodec -C link-arg=-lswscale -C link-arg=-lswresample -C link-arg=-lavutil -C link-arg=-Wl,--end-group -C link-arg=-lz"
          cargo test --target "$(rustc -vV | sed -n 's/host: //p')" --no-fail-fast --no-default-features --lib --tests $ENGINE_TESTS \
            -- --skip every_effect_is_off_at_zero_and_changes_the_frame_at_full_strength

      # The software encoders. Not run here: the tests whose exports must match a colour within
      # 3 levels (ProRes 4:2:2, and H.264 through Cisco's OpenH264 in tests/openh264.rs), since
      # Mesa's software Vulkan renders that colour 2 levels off (190 for 192) and 4:2:x rounding
      # adds the rest; to check on real GPUs. OpenH264's download, loading and an H.264 export
      # are checked by the packaged app's smoke test below instead.
      - name: Export tests (software encoders)
        working-directory: engine
        env:
          FFMPEG_LIB: ${{ github.workspace }}/engine/.ffmpeg/${{ matrix.ffmpeg }}/lib
          FFMPEG_DIR: ${{ github.workspace }}/engine/.ffmpeg/${{ matrix.ffmpeg }}
        run: |
          # ffmpeg-static's ffmpeg (6.1) for the tests that make clips (Ubuntu's 4.4 lacks options
          # they use); ffprobe is the system's.
          export PATH="$(dirname "$(node -p "require('../apps/app/node_modules/ffmpeg-static')")"):$PATH"
          export RUSTFLAGS="-L $FFMPEG_LIB -C link-arg=-Wl,--start-group -C link-arg=-lavformat -C link-arg=-lavfilter -C link-arg=-lavcodec -C link-arg=-lswscale -C link-arg=-lswresample -C link-arg=-lavutil -C link-arg=-Wl,--end-group -C link-arg=-lz"
          host="$(rustc -vV | sed -n 's/host: //p')"
          cargo test --target "$host" -p openrip-export --lib --test software -- --skip prores_422_in_software

      - name: Build the app
        working-directory: apps/app
        run: npm run build

      # After the build: some import the preload package's built output.
      - name: Renderer tests
        working-directory: apps/app/packages/renderer
        run: node --test tests/*.test.ts

      - name: Package (${{ matrix.packages }})
        working-directory: apps/app
        env:
          USE_SYSTEM_FPM: ${{ matrix.arch == 'arm64' }}
        run: npx electron-builder build --config electron-builder.cjs --linux ${{ matrix.packages }} --${{ matrix.arch }} --publish never

      - name: Smoke test (packaged app under Xvfb)
        working-directory: apps/app
        run: |
          set -o pipefail
          FFMPEG=$(node -p "require('ffmpeg-static')")
          mkdir -p smoke-out
          "$FFMPEG" -v error -y -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 4 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest smoke-out/xplat-clip.mp4
          export EXE="$PWD/dist/linux-${{ matrix.arch == 'x64' && '' || 'arm64-' }}unpacked/openrip"
          export CLIP_NAME=xplat-clip OPENRIP_ENGINE_MUTE=1
          export FFPROBE=$(command -v ffprobe)
          xvfb-run -a -s "-screen 0 1920x1080x24" node scripts/smoke/session.mjs . smoke-out smoke-out/ud "$PWD/smoke-out/xplat-clip.mp4" import timeline xplat | tee smoke-out/smoke.log
          grep -q "STEP xplat: ok" smoke-out/smoke.log

      - name: Installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrip-linux-${{ matrix.arch }}
          path: |
            apps/app/dist/*.deb
            apps/app/dist/*.AppImage
          retention-days: 7
          if-no-files-found: ignore

      - name: Smoke test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-linux-${{ matrix.arch }}
          path: |
            apps/app/smoke-out/*.png
            apps/app/smoke-out/*.txt
            apps/app/smoke-out/*.log
          retention-days: 7
          if-no-files-found: ignore

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 150
    # PowerShell, not Git Bash, whose /usr/bin/link would shadow MSVC's link.exe.
    defaults:
      run:
        shell: pwsh
    steps:
      # build-ffmpeg.sh runs in MSYS2's bash: keep the scripts' line endings as they are.
      - name: Line endings
        run: git config --global core.autocrlf false
        shell: bash

      - uses: actions/checkout@v4

      # MSVC's cl.exe, link.exe, lib.exe and dumpbin on the PATH for the rest of the job.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MSYS
          path-type: inherit
          install: make nasm diffutils

      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
        shell: bash

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
            engine -> target/addon
          cache-on-failure: true

      - name: FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            engine/.ffmpeg/windows-x86_64
            engine/.ffmpeg/zlib-windows-x86_64
          key: ffmpeg-windows-x86_64-${{ hashFiles('engine/scripts/build-ffmpeg.sh') }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/app/package-lock.json

      - name: npm ci
        working-directory: apps/app
        run: npm ci

      - name: Engine addon (FFmpeg and openrip-node)
        working-directory: apps/app
        env:
          MSYS2_BASH: ${{ steps.msys2.outputs.msys2-location }}\usr\bin\bash.exe
        run: node scripts/build-engine.mjs

      - name: Save FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true' && hashFiles('engine/.ffmpeg/windows-x86_64/.version') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            engine/.ffmpeg/windows-x86_64
            engine/.ffmpeg/zlib-windows-x86_64
          key: ffmpeg-windows-x86_64-${{ hashFiles('engine/scripts/build-ffmpeg.sh') }}

      # As on Linux, all of FFmpeg's libraries (MSVC's linker needs no group), with the static
      # C runtime FFmpeg is built with and the libraries the addon's build.rs names. Skipped:
      # three GL transition tests whose parameters (a fade's colour) don't come through on WARP,
      # DirectX 12's software adapter, though they do on Metal and Mesa; to check on a real
      # Windows GPU (WARP, or DirectX 12's HLSL for gl-transitions' smoothstep edges).
      - name: Engine tests (portable crates)
        working-directory: engine
        env:
          FFMPEG_DIR: ${{ github.workspace }}\engine\.ffmpeg\windows-x86_64
          RUSTFLAGS: -L ${{ github.workspace }}\engine\.ffmpeg\windows-x86_64\lib -C target-feature=+crt-static -C link-arg=avformat.lib -C link-arg=avfilter.lib -C link-arg=avcodec.lib -C link-arg=swscale.lib -C link-arg=swresample.lib -C link-arg=avutil.lib -C link-arg=zlib.lib -C link-arg=bcrypt.lib -C link-arg=ole32.lib -C link-arg=user32.lib -C link-arg=mfuuid.lib -C link-arg=strmiids.lib
        run: >
          cargo test --target x86_64-pc-windows-msvc --no-fail-fast --no-default-features --lib --tests $($env:ENGINE_TESTS -split ' ')
          -- --skip parameters_change_the_picture --skip every_transition_starts_at_the_outgoing_clip_and_ends_at_the_incoming_one
          --skip shader_transitions_draw_the_clips_through_the_collection

      # As on Linux; ffmpeg and ffprobe from the app's npm packages. Media Foundation's
      # encoders are tried first here.
      - name: Export tests (software encoders, Media Foundation, OpenH264)
        working-directory: engine
        env:
          FFMPEG_DIR: ${{ github.workspace }}\engine\.ffmpeg\windows-x86_64
          RUSTFLAGS: -L ${{ github.workspace }}\engine\.ffmpeg\windows-x86_64\lib -C target-feature=+crt-static -C link-arg=avformat.lib -C link-arg=avfilter.lib -C link-arg=avcodec.lib -C link-arg=swscale.lib -C link-arg=swresample.lib -C link-arg=avutil.lib -C link-arg=zlib.lib -C link-arg=bcrypt.lib -C link-arg=ole32.lib -C link-arg=user32.lib -C link-arg=mfuuid.lib -C link-arg=strmiids.lib
        run: |
          $ffmpeg = Split-Path (node -p "require('../apps/app/node_modules/ffmpeg-static')")
          $ffprobe = Split-Path (node -p "require('../apps/app/node_modules/ffprobe-static').path")
          $env:PATH = "$ffmpeg;$ffprobe;$env:PATH"
          cargo test --target x86_64-pc-windows-msvc -p openrip-export --lib --test software
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --target x86_64-pc-windows-msvc -p openrip-export --test openh264 -- --ignored

      - name: Build the app
        working-directory: apps/app
        env:
          MSYS2_BASH: ${{ steps.msys2.outputs.msys2-location }}\usr\bin\bash.exe
        run: npm run build

      # After the build: some import the preload package's built output.
      - name: Renderer tests
        working-directory: apps/app/packages/renderer
        run: node --test tests/*.test.ts

      - name: Package (NSIS installer)
        working-directory: apps/app
        run: npx electron-builder build --config electron-builder.cjs --win nsis --x64 --publish never

      - name: Smoke test (packaged app)
        working-directory: apps/app
        shell: bash
        run: |
          set -o pipefail
          FFMPEG=$(node -p "require('ffmpeg-static')")
          mkdir -p smoke-out
          "$FFMPEG" -v error -y -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 4 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest smoke-out/xplat-clip.mp4
          export EXE="$(cygpath -w "$PWD/dist/win-unpacked/OpenRip.exe")"
          export CLIP_NAME=xplat-clip OPENRIP_ENGINE_MUTE=1
          export FFPROBE=$(node -p "require('ffprobe-static').path")
          node scripts/smoke/session.mjs . smoke-out smoke-out/ud "$(cygpath -w "$PWD/smoke-out/xplat-clip.mp4")" import timeline xplat | tee smoke-out/smoke.log
          grep -q "STEP xplat: ok" smoke-out/smoke.log

      - name: Installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrip-windows-x64
          path: apps/app/dist/*-setup.exe
          retention-days: 7
          if-no-files-found: ignore

      - name: Smoke test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-windows-x64
          path: |
            apps/app/smoke-out/*.png
            apps/app/smoke-out/*.txt
            apps/app/smoke-out/*.log
          retention-days: 7
          if-no-files-found: ignore
