[workspace]
resolver = "2"
members = ["crates/model", "crates/platform", "crates/motion", "crates/analysis", "crates/capcut", "crates/v1", "crates/frame", "crates/media", "crates/audio", "crates/playback", "crates/render", "crates/core", "crates/node", "crates/export", "crates/dev"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/totokunda/openrip"
publish = false

[workspace.dependencies]
# The crates with FFmpeg (or cpal) behind a default feature come without it here: each
# member asks for the features it needs (see docs/plan/portability.md).
openrip-model = { path = "crates/model" }
openrip-platform = { path = "crates/platform" }
openrip-motion = { path = "crates/motion" }
openrip-analysis = { path = "crates/analysis" }
openrip-capcut = { path = "crates/capcut" }
openrip-v1 = { path = "crates/v1" }
openrip-frame = { path = "crates/frame" }
openrip-media = { path = "crates/media", default-features = false }
openrip-audio = { path = "crates/audio", default-features = false }
openrip-playback = { path = "crates/playback", default-features = false }
openrip-render = { path = "crates/render" }
openrip-export = { path = "crates/export", default-features = false }
openrip-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"

# The motion maths (tracking, optical flow) is per-pixel work: optimised even in debug builds
# and tests, which would otherwise take a minute over a few small pictures.
[profile.dev.package.openrip-motion]
opt-level = 3
