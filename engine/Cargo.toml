[workspace]
resolver = "2"
members = ["crates/model", "crates/platform", "crates/capcut", "crates/v1", "crates/frame", "crates/media", "crates/audio", "crates/playback", "crates/render", "crates/core", "crates/node", "crates/export", "crates/dev"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/totokunda/openrip"
publish = false

[workspace.dependencies]
openrip-model = { path = "crates/model" }
openrip-platform = { path = "crates/platform" }
openrip-capcut = { path = "crates/capcut" }
openrip-v1 = { path = "crates/v1" }
openrip-frame = { path = "crates/frame" }
openrip-media = { path = "crates/media" }
openrip-audio = { path = "crates/audio" }
openrip-playback = { path = "crates/playback" }
openrip-render = { path = "crates/render" }
openrip-export = { path = "crates/export" }
openrip-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
