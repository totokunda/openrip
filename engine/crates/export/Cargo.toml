[package]
name = "openrip-export"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Offline render and encode of a project to a video file"

[dependencies]
ffmpeg-sys-next = { version = "9.0.1", default-features = false, features = ["avcodec", "avformat"] }
openrip-model.workspace = true
openrip-playback.workspace = true
openrip-audio.workspace = true
openrip-render.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString", "CFBase"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer", "CVPixelBufferPool", "CVBuffer", "CVImageBuffer", "CVReturn", "CVBase"] }

[dev-dependencies]
serde_json.workspace = true
