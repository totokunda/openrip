[package]
name = "openrip-export"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Offline render and encode of a project to a video file"

[dependencies]
ffmpeg-sys-next = { version = "9.0.1", default-features = false, features = ["avcodec", "avformat"], optional = true }
openrip-model.workspace = true
openrip-playback.workspace = true
openrip-audio.workspace = true
openrip-render.workspace = true
thiserror.workspace = true
gif = "0.13"
color_quant = "1"
flacenc = "0.5.1"
mp3lame-encoder = { version = "0.2.5", optional = true }

[features]
default = ["ffmpeg"]
# The encoder (VideoToolbox through FFmpeg on Apple platforms), and decoding through FFmpeg.
ffmpeg = ["dep:ffmpeg-sys-next", "dep:objc2-core-foundation", "dep:objc2-core-video", "openrip-playback/ffmpeg", "openrip-audio/ffmpeg", "dep:mp3lame-encoder"]

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString", "CFBase"], optional = true }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer", "CVPixelBufferPool", "CVBuffer", "CVImageBuffer", "CVReturn", "CVBase"], optional = true }

[dev-dependencies]
serde_json.workspace = true

# These decode or play real media: they need the built-in backends.

[[test]]
name = "export"
required-features = ["ffmpeg"]

[[test]]
name = "formats"
required-features = ["ffmpeg"]

[[test]]
name = "prerender"
required-features = ["ffmpeg"]
