[package]
name = "openrip-dev"
version = "0.1.0"
description = "Developer CLI for inspecting and importing projects"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "openrip-dev"
path = "src/main.rs"

[dependencies]
openrip-model.workspace = true
openrip-capcut.workspace = true
openrip-v1.workspace = true
openrip-media.workspace = true
openrip-playback.workspace = true
openrip-render.workspace = true
openrip-export.workspace = true
openrip-audio.workspace = true
png = "0.18"
serde_json.workspace = true
# Only to switch FFmpeg to static linking, to check the app's FFmpeg build against drafts.
ffmpeg-sys-next = { version = "9.0.1", default-features = false, optional = true }

[features]
# FFmpeg linked statically from FFMPEG_DIR, as in the app's addon (see openrip-node).
static-ffmpeg = ["dep:ffmpeg-sys-next", "ffmpeg-sys-next/static"]
