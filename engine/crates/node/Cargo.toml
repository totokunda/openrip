[package]
name = "openrip-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Node/Electron addon (napi) exposing the engine's preview to the app"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
openrip-model.workspace = true
openrip-capcut.workspace = true
openrip-v1.workspace = true
openrip-playback.workspace = true
openrip-audio.workspace = true
openrip-render.workspace = true
openrip-export.workspace = true
serde_json.workspace = true
# Only to switch FFmpeg to static linking (see the feature below).
ffmpeg-sys-next = { version = "9.0.1", default-features = false, optional = true }

[features]
# Link FFmpeg statically from FFMPEG_DIR (engine/scripts/build-ffmpeg.sh), so the addon
# needs no FFmpeg installed. The app's builds use it (apps/app/scripts/build-engine.mjs).
static-ffmpeg = ["dep:ffmpeg-sys-next", "ffmpeg-sys-next/static"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVBase", "objc2-io-surface"] }
objc2-io-surface = { version = "0.3", default-features = false, features = ["std", "IOSurfaceRef", "objc2-core-foundation"] }

[build-dependencies]
napi-build = "2"
