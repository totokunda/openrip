[package]
name = "openrip-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Node/Electron addon (napi): a thin wrapper exposing openrip-core to the app"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"
openrip-core.workspace = true
# Only to switch FFmpeg to static linking (see the feature below).
ffmpeg-sys-next = { version = "9.0.1", default-features = false, optional = true }

[features]
# Link FFmpeg statically from FFMPEG_DIR (engine/scripts/build-ffmpeg.sh), so the addon
# needs no FFmpeg installed. The app's builds use it (apps/app/scripts/build-engine.mjs).
static-ffmpeg = ["dep:ffmpeg-sys-next", "ffmpeg-sys-next/static"]

[build-dependencies]
napi-build = "2"
