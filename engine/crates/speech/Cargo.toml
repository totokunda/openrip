[package]
name = "openrip-speech"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Speech to captions: the portable part (words to caption clips) and a local Whisper backend"

[dependencies]
serde.workspace = true
thiserror.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
whisper-rs = { version = "0.16", optional = true, features = ["metal", "log_backend"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
whisper-rs = { version = "0.16", optional = true, features = ["log_backend"] }

[features]
default = []
# whisper.cpp through whisper-rs (Metal on Apple platforms).
whisper = ["dep:whisper-rs"]
