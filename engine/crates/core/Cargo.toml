[package]
name = "openrip-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The engine's API as plain Rust, for every client: the Node addon today, Swift/Kotlin or wasm bindings later"

[dependencies]
openrip-model.workspace = true
openrip-capcut.workspace = true
openrip-v1.workspace = true
openrip-media.workspace = true
openrip-playback.workspace = true
openrip-audio.workspace = true
openrip-render.workspace = true
openrip-export.workspace = true
openrip-platform.workspace = true
openrip-motion.workspace = true
openrip-analysis.workspace = true
openrip-speech.workspace = true
serde_json.workspace = true
# Still frames saved as PNG (pure Rust).
png = "0.18"
thiserror.workspace = true

[dev-dependencies]
png = "0.18"
openrip-render.workspace = true

[features]
default = ["ffmpeg", "audio-output"]
# Decoding and encoding through FFmpeg (and VideoToolbox on Apple platforms).
ffmpeg = ["openrip-media/ffmpeg", "openrip-audio/ffmpeg", "openrip-playback/ffmpeg", "openrip-export/ffmpeg"]
# Audio output through cpal.
audio-output = ["openrip-playback/cpal"]
# Speech recognition with whisper.cpp (Metal on Apple platforms): a native library built by
# cmake, so not on by default. The desktop addon turns it on.
whisper = ["openrip-speech/whisper"]

# Records from the stand-in microphone and decodes what it wrote: needs the built-in decoder.

[[test]]
name = "audio"
required-features = ["ffmpeg"]

# Tracks a square through a video made with the ffmpeg CLI: needs the built-in decoder.

[[test]]
name = "track"
required-features = ["ffmpeg"]

# Transcribes speech made with macOS `say` using the tiny model: needs whisper.cpp and the decoder.

[[test]]
name = "speech"
required-features = ["whisper", "ffmpeg"]
