[package]
name = "openrip-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The engine's API as plain Rust, for every client: the Node addon today, Swift/Kotlin or wasm bindings later"

[dependencies]
openrip-model.workspace = true
openrip-capcut.workspace = true
openrip-v1.workspace = true
openrip-media.workspace = true
openrip-playback.workspace = true
openrip-audio.workspace = true
openrip-render.workspace = true
openrip-export.workspace = true
openrip-platform.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
default = ["ffmpeg", "audio-output"]
# Decoding and encoding through FFmpeg (and VideoToolbox on macOS).
ffmpeg = ["openrip-media/ffmpeg", "openrip-audio/ffmpeg", "openrip-playback/ffmpeg", "openrip-export/ffmpeg"]
# Audio output through cpal.
audio-output = ["openrip-playback/cpal"]
