[package]
name = "openrip-playback"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Frame serving for preview: per-source decode workers, scrub and accurate seeks"

[dependencies]
openrip-media.workspace = true
openrip-model.workspace = true
openrip-render.workspace = true
openrip-audio.workspace = true
openrip-platform.workspace = true
openrip-analysis.workspace = true
openrip-motion.workspace = true
cpal = { version = "0.18", optional = true }
png = "0.18"
# Stickers: animated and still WebP, and SVG drawn to a bitmap (both pure Rust, no system libraries).
image-webp = "0.2"
resvg = { version = "0.48", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
default = ["ffmpeg", "cpal"]
# Decoding through FFmpeg (and VideoToolbox), the built-in backends.
ffmpeg = ["openrip-media/ffmpeg", "openrip-audio/ffmpeg"]
# Audio output through cpal, the built-in one.
cpal = ["dep:cpal"]

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer", "CVBase"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }

# These decode or play real media: they need the built-in backends.

[[test]]
name = "preview"
required-features = ["ffmpeg"]

[[test]]
name = "server"
required-features = ["ffmpeg"]

[[test]]
name = "thumbs"
required-features = ["ffmpeg"]

[[test]]
name = "slowmo"
required-features = ["ffmpeg"]
[[test]]
name = "enhance"
required-features = ["ffmpeg"]

[[example]]
name = "clock"
required-features = ["cpal"]
