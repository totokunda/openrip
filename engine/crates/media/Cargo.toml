[package]
name = "openrip-media"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Decode seams, with FFmpeg and hardware decode (VideoToolbox) behind them"

[dependencies]
ffmpeg-sys-next = { version = "9.0.1", default-features = false, features = ["avcodec", "avformat", "swscale"], optional = true }
thiserror.workspace = true
png = "0.18"
serde.workspace = true
openrip-model.workspace = true
openrip-frame.workspace = true
openrip-platform.workspace = true

[features]
default = ["ffmpeg"]
# FFmpeg demux and decode, with VideoToolbox on macOS (the built-in backends).
ffmpeg = ["dep:ffmpeg-sys-next", "dep:objc2-core-video", "dep:objc2-io-surface", "dep:objc2-core-foundation", "dep:objc2-core-media", "dep:objc2-video-toolbox"]

# VideoToolbox, driven with packets FFmpeg demuxes.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVImageBuffer", "CVBuffer", "CVReturn", "CVBase", "objc2-io-surface"], optional = true }
objc2-io-surface = { version = "0.3", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "objc2-core-foundation"], optional = true }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFData", "CFString", "CFNumber", "CFBase"], optional = true }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMBase", "CMTime", "CMFormatDescription", "CMBlockBuffer", "CMSampleBuffer", "CMSync", "objc2-core-video"], optional = true }
objc2-video-toolbox = { version = "0.3", default-features = false, features = ["std", "VTBase", "VTErrors", "VTSession", "VTDecompressionSession", "VTDecompressionProperties", "objc2-core-media", "objc2-core-video"], optional = true }

# These decode or play real media: they need the built-in backends.

[[test]]
name = "decode"
required-features = ["ffmpeg"]

[[example]]
name = "native_probe"
required-features = ["ffmpeg"]

[[example]]
name = "open_cost"
required-features = ["ffmpeg"]

[[example]]
name = "paced"
required-features = ["ffmpeg"]

[[example]]
name = "trace_seek"
required-features = ["ffmpeg"]

[[example]]
name = "trace_seq"
required-features = ["ffmpeg"]
