[package]
name = "openrip-media"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Demux and decode through FFmpeg, with hardware decode"

[dependencies]
ffmpeg-sys-next = { version = "9.0.1", default-features = false, features = ["avcodec", "avformat", "swscale"] }
thiserror.workspace = true
serde.workspace = true
openrip-model.workspace = true
openrip-frame.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVImageBuffer", "CVBuffer", "CVReturn", "CVBase", "objc2-io-surface"] }
objc2-io-surface = { version = "0.3", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFData", "CFString", "CFNumber", "CFBase"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMBase", "CMTime", "CMFormatDescription", "CMBlockBuffer", "CMSampleBuffer", "CMSync", "objc2-core-video"] }
objc2-video-toolbox = { version = "0.3", default-features = false, features = ["std", "VTBase", "VTErrors", "VTSession", "VTDecompressionSession", "VTDecompressionProperties", "objc2-core-media", "objc2-core-video"] }
