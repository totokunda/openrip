[package]
name = "openrip-render"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "GPU compositor (wgpu) reproducing CapCut's measured rendering pipeline"

[dependencies]
wgpu = "30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
thiserror.workspace = true
swash = "0.2"
# WOFF2 web fonts (the app's bundled fonts), decoded in pure Rust for every target.
wuff = { version = "0.2", default-features = false, features = ["brotli"] }
openrip-frame.workspace = true
openrip-platform.workspace = true
openrip-motion.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString", "CFBase"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLTexture", "MTLPixelFormat", "MTLResource", "MTLTypes", "objc2-io-surface"] }
objc2-io-surface = { version = "0.3", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "objc2-core-foundation"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVImageBuffer", "CVBuffer", "CVReturn", "CVBase", "objc2-io-surface"] }

# On the web (wasm without threads) wgpu's objects aren't Send, and the engine's types that
# hold them are Send for its worker threads. A web build has no other threads, which is
# what this feature relies on (see docs/plan/portability.md).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["fragile-send-sync-non-atomic-wasm"] }

[dev-dependencies]
# Frames to draw in the tests come from the decoder.
openrip-media = { workspace = true, features = ["ffmpeg"] }
openrip-model.workspace = true
openrip-motion.workspace = true

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer", "CVBase", "CVReturn"] }

